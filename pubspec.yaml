name: smogshield
description: SmogShield AI Flutter Phase 1 mock-data starter
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  fl_chart: ^1.1.1
  intl: ^0.20.3
  http: ^1.6.0
  shared_preferences: ^2.5.3
  geolocator: ^14.1.2
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - config/frontend.json
